name: JM Author List
on:
  workflow_dispatch:
    inputs:
      kw:
        description: kw
        required: false
        type: string
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jmcomic -q
      - run: python3 jm_author_list.py "${{ github.event.inputs.kw }}"
