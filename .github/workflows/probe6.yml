name: JM Probe6
on:
  workflow_dispatch:
    inputs:
      target:
        description: target id
        required: true
        type: string
jobs:
  probe6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jmcomic -q
      - run: python3 jm_probe6.py "${{ github.event.inputs.target }}"
