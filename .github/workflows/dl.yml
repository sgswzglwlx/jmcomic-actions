name: JM Download
on:
  workflow_dispatch:
    inputs:
      mode:
        description: search or download
        required: true
        default: search
        type: choice
        options:
          - search
          - download
      keyword:
        description: search keyword or album id
        required: false
        default: ""
        type: string
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jmcomic -q
      - run: python3 search_album.py ${{ github.event.inputs.mode }} "${{ github.event.inputs.keyword }}"
      - if: ${{ github.event.inputs.mode == 'download' }}
        uses: actions/upload-artifact@v4
        with:
          name: jm-download
          path: /tmp/jm/
