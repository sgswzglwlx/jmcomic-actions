name: Pix Meta
on:
  workflow_dispatch:
    inputs:
      pid:
        required: true
        type: string
jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install curl_cffi -q
      - run: python3 pix_meta.py "${{ github.event.inputs.pid }}"
