name: JM Author
on:
  workflow_dispatch:
    inputs:
      name:
        description: author name
        required: true
        type: string
jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jmcomic -q
      - run: python3 jm_author.py "${{ github.event.inputs.name }}"
