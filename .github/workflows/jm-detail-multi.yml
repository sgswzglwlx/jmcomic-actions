name: JM Detail Multi
on:
  workflow_dispatch:
    inputs:
      ids:
        description: ids
        required: false
        type: string
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jmcomic -q
      - run: python3 jm_detail_multi.py "${{ github.event.inputs.ids }}"
